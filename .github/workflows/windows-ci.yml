name: Windows CI

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-nvidia
  pull_request:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          npm ci --prefix desktop
      - name: Python worker tests
        run: python -m unittest discover -s ai_worker/tests -v
      - name: Frontend tests
        run: npm test --prefix desktop -- --run
      - name: Frontend build
        run: npm run build --prefix desktop
      - name: Rust format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib

  macos-regression:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: npm ci --prefix desktop
      - run: python -m unittest discover -s ai_worker/tests -v
      - run: npm test --prefix desktop -- --run
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
