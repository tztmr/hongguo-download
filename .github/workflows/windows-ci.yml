name: Windows CI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional tag, branch, or commit to test (defaults to the workflow ref)
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Show tested revision
        run: git log -1 --format="%H %s"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML numpy==1.26.4 -r requirements.txt
          npm ci --prefix desktop
      - name: Python worker tests
        run: python -m unittest discover -s ai_worker/tests -v
      - name: Playback route and cancellation tests
        run: python -m unittest tests.test_playback tests.test_video_download tests.test_mp4_decrypt -v
      - name: Release upload regression
        run: python -m unittest tests.test_windows_release_workflow -v
      - name: Frontend tests
        run: npm test --prefix desktop -- --run
      - name: Frontend build
        run: npm run build --prefix desktop
      - name: Rust format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Rust app build
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --bin hongguo-desktop

  macos-regression:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Show tested revision
        run: git log -1 --format="%H %s"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: python -m pip install --disable-pip-version-check PyYAML numpy==1.26.4 -r requirements.txt
      - run: npm ci --prefix desktop
      - run: python -m unittest discover -s ai_worker/tests -v
      - run: npm test --prefix desktop -- --run
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
