name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      ffmpeg_url:
        description: HTTPS URL of the pinned Windows FFmpeg archive
        required: true
        type: string
      ffmpeg_sha256:
        description: SHA-256 of the FFmpeg archive
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Download pinned FFmpeg
        shell: pwsh
        run: Invoke-WebRequest -Uri '${{ inputs.ffmpeg_url }}' -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
      - name: Build NSIS installer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          ./scripts/build-release-windows.ps1 -FfmpegArchive "$env:RUNNER_TEMP/ffmpeg.zip" -FfmpegArchiveSha256 '${{ inputs.ffmpeg_sha256 }}'
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/verify-release-windows.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-windows-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
