name: Build Windows AI runtimes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        flavor: [modern, legacy, cpu]
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ai-windows-common.txt
            requirements-ai-windows-${{ matrix.flavor }}.txt
      - name: Build runtime
        shell: pwsh
        run: ./scripts/build-ai-runtime-windows.ps1 -Flavor '${{ matrix.flavor }}'
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-ai-runtime-windows-${{ matrix.flavor }}
          path: dist/ai-components/hongguo-ai-runtime-windows-${{ matrix.flavor }}.zip
          if-no-files-found: error
          retention-days: 14
